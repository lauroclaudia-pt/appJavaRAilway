<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Plataforma de Recrutamento do IPMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/img/ipma-mark.png" type="image/png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <a href="/index.html" class="brand"><img src="/img/ipma-mark.png" alt="IPMA" class="brand-mark">Plataforma de Recrutamento <small>do IPMA</small></a>
  <nav class="nav">
    <a href="/index.html">Início</a>
    <a href="/jobs.html">Ofertas</a>
    <a href="/login.html" class="current">Entrar</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-side">
    <div class="quote">
      "Cada procedimento acompanhado com o mesmo rigor com que se lê uma carta de tempo."
      <small>Divisão de Recursos Humanos — IPMA, I.P.</small>
    </div>
    <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="login-arc-outer" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#54c8ee"/>
          <stop offset="100%" stop-color="#1c4f8f"/>
        </linearGradient>
      </defs>
      <circle cx="-60" cy="560" r="420" fill="none" stroke="url(#login-arc-outer)" stroke-width="10"/>
      <circle cx="-60" cy="560" r="340" fill="none" stroke="#c7d6e2" stroke-width="10"/>
      <circle cx="-100" cy="590" r="240" fill="none" stroke="#f5a623" stroke-width="10" stroke-dasharray="220 1600"/>
    </svg>
  </div>

  <div class="auth-form-col">
    <h1>Entrar</h1>
    <p class="subtitle">Acesso reservado a gestores de recursos humanos, membros de júri e administração.</p>

    <div class="form-error" id="error-box"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email institucional</label>
        <input type="email" id="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="submit-btn">Entrar</button>
    </form>

    <p class="back-link"><a href="/index.html">&larr; Voltar à página inicial</a></p>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("error-box");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "A verificar…";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const res = await fetch("/api/auth/me", {
        headers: { Authorization: "Basic " + btoa(email + ":" + password) },
      });

      if (res.ok) {
        setAuth(email, password);
        window.location.href = "/dashboard.html";
      } else if (res.status === 401 || res.status === 403) {
        errorBox.textContent = "Email ou palavra-passe incorretos.";
        errorBox.classList.add("visible");
      } else {
        errorBox.textContent = "Não foi possível confirmar as credenciais. Tente novamente.";
        errorBox.classList.add("visible");
      }
    } catch (err) {
      errorBox.textContent = "Falha de ligação ao servidor. Tente novamente.";
      errorBox.classList.add("visible");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Entrar";
    }
  });

  if (getAuth()) window.location.href = "/dashboard.html";
</script>
</body>
</html>
