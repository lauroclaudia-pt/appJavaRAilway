<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Interno — Plataforma de Recrutamento do IPMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="/img/ipma-mark.png" type="image/png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <a href="/index.html" class="brand"><img src="/img/ipma-mark.png" alt="IPMA" class="brand-mark">Plataforma de Recrutamento <small>do IPMA</small></a>
  <nav class="nav">
    <a href="/index.html">Início</a>
    <a href="/jobs.html">Ofertas</a>
    <a href="#" class="btn btn-ghost" id="logout-link">Sair</a>
  </nav>
</header>

<div class="dash-header">
  <span class="role-tag" id="role-tag">—</span>
  <h1 id="welcome">Bem-vindo(a)</h1>
  <p id="welcome-sub">A carregar o seu perfil…</p>
</div>

<div class="dash-grid" id="dash-grid"></div>

<div class="hero-stats" id="stats-strip" style="display:none; padding:0 40px 32px; border-bottom:1px solid var(--line);"></div>

<section class="section" id="minhas-section" style="border-top:1px solid var(--line); border-bottom:none; display:none;">
  <div class="section-head">
    <h2>Os meus procedimentos</h2>
    <span class="meta" id="minhas-meta"></span>
  </div>
  <div class="bulletin" id="minhas-list">
    <div class="empty-state">A carregar…</div>
  </div>
</section>

<section class="section" style="border-top:1px solid var(--line); border-bottom:none;">
  <div class="section-head">
    <h2>Todas as vagas</h2>
    <span class="meta" id="vagas-meta"></span>
  </div>
  <div class="bulletin" id="vagas-list">
    <div class="empty-state">A carregar…</div>
  </div>
</section>

<script src="/js/app.js"></script>
<script>
  requireAuth();

  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    logout();
  });

  const CARDS_BY_ROLE = {
    ADMIN: [
      { title: "Administração", desc: "Gerir utilizadores e as listas de opções da candidatura.", href: "/admin.html" },
      { title: "Todas as vagas", desc: "Consultar o estado de todos os procedimentos em curso.", href: "#vagas" },
      { title: "Ofertas públicas", desc: "Ver o que está publicado no website.", href: "/jobs.html" },
    ],
    CDRH: [
      { title: "Abrir vaga", desc: "Criar um novo procedimento concursal ou bolsa.", href: "/vaga-form.html" },
      { title: "Candidatos por vaga", desc: "Selecione uma vaga na lista abaixo para rever candidatos.", href: "#vagas" },
      { title: "Gerar Ata", desc: "Abra uma vaga na lista abaixo para emitir a Ata em PDF.", href: "#vagas" },
    ],
    GESTOR_RH: [
      { title: "Abrir vaga", desc: "Criar um novo procedimento concursal ou bolsa.", href: "/vaga-form.html" },
      { title: "Candidatos por vaga", desc: "Selecione uma vaga na lista abaixo para rever candidatos.", href: "#vagas" },
      { title: "Gerar Ata", desc: "Abra uma vaga na lista abaixo para emitir a Ata em PDF.", href: "#vagas" },
    ],
    JURI: [
      { title: "Candidatos por vaga", desc: "Selecione uma vaga na lista abaixo para rever candidatos.", href: "#vagas" },
      { title: "Gerar Ata", desc: "Abra uma vaga na lista abaixo para emitir a Ata em PDF.", href: "#vagas" },
    ],
    PORTAL: [
      { title: "A sua candidatura", desc: "Acompanhe o estado da sua candidatura pelo número de referência recebido por email.", href: "#" },
      { title: "Ofertas abertas", desc: "Consultar novas oportunidades no IPMA.", href: "/jobs.html" },
    ],
  };

  apiFetch("/api/auth/me")
    .then(r => r.json())
    .then(user => {
      document.getElementById("role-tag").textContent = user.roles.map(roleLabel).join(" · ") || "Sem responsabilidades atribuídas";
      document.getElementById("welcome").textContent = "Bem-vindo(a), " + user.name;
      document.getElementById("welcome-sub").textContent = user.email;

      // Junta os cartões de todas as responsabilidades do trabalhador, sem repetir títulos.
      const seen = new Set();
      const cards = [];
      user.roles.forEach(role => {
        (CARDS_BY_ROLE[role] || []).forEach(c => {
          if (!seen.has(c.title)) { seen.add(c.title); cards.push(c); }
        });
      });

      document.getElementById("dash-grid").innerHTML = cards.map(c => `
        <div class="dash-card">
          <h3>${c.title}</h3>
          <p>${c.desc}${c.note ? "<br><em>" + c.note + "</em>" : ""}</p>
          <a class="btn btn-ghost" href="${c.href}">Abrir</a>
        </div>
      `).join("");

      if (hasRole(user, "ADMIN", "CDRH", "GESTOR_RH", "JURI")) {
        loadVagas();
        loadMinhas();
      } else {
        document.getElementById("vagas-list").innerHTML = '<div class="empty-state">Sem vagas internas para o seu perfil.</div>';
      }
    })
    .catch(() => {
      document.getElementById("welcome-sub").textContent = "Não foi possível confirmar a sessão.";
    });

  const stateLabels = { DRAFT: "Rascunho", PUBLISHED: "Publicada", RUNNING: "Em curso", FINISHED: "Concluída", CANCELLED: "Cancelada", DESERT: "Deserta" };

  function renderVagaRow(v) {
    return `
      <a class="bulletin-row" id="job-${v.id}" href="/vaga-detail.html?id=${v.id}" style="text-decoration:none; color:inherit;">
        <div>
          <span class="title">${v.name}</span>
          <span class="subtitle">${v.jobPosition || ""} · Código ${v.vagaCode || "—"}</span>
        </div>
        <span class="tag state-${(v.state || "").toLowerCase()}">${stateLabels[v.state] || v.state}</span>
        <span class="deadline">Etapa: ${v.currentStageCode || "—"}</span>
      </a>
    `;
  }

  function renderStats(vagas) {
    const abertas = vagas.filter(v => v.state === "DRAFT" || v.state === "PUBLISHED").length;
    const emCurso = vagas.filter(v => v.state === "RUNNING").length;
    const concluidas = vagas.filter(v => v.state === "FINISHED").length;
    const strip = document.getElementById("stats-strip");
    strip.style.display = "flex";
    strip.innerHTML = `
      <div><span class="stat-value">${abertas}</span><span class="stat-label">abertas</span></div>
      <div><span class="stat-value">${emCurso}</span><span class="stat-label">em curso</span></div>
      <div><span class="stat-value">${concluidas}</span><span class="stat-label">concluídas</span></div>
      <div><span class="stat-value">${vagas.length}</span><span class="stat-label">total</span></div>
    `;
  }

  function loadVagas() {
    apiFetch("/api/backoffice/vagas")
      .then(r => r.json())
      .then(vagas => {
        renderStats(vagas);
        document.getElementById("vagas-meta").textContent = vagas.length + " vaga(s)";
        if (vagas.length === 0) {
          document.getElementById("vagas-list").innerHTML = '<div class="empty-state">Ainda não existem vagas criadas.</div>';
          return;
        }
        document.getElementById("vagas-list").innerHTML = vagas.map(renderVagaRow).join("");
      })
      .catch(() => {
        document.getElementById("vagas-list").innerHTML = '<div class="empty-state">Não foi possível carregar as vagas.</div>';
      });
  }

  function loadMinhas() {
    apiFetch("/api/backoffice/vagas/minhas")
      .then(r => r.json())
      .then(vagas => {
        document.getElementById("minhas-section").style.display = "block";
        document.getElementById("minhas-meta").textContent = vagas.length + " procedimento(s)";
        document.getElementById("minhas-list").innerHTML = vagas.length === 0
          ? '<div class="empty-state">Não está indicado como gestor ou júri em nenhum procedimento.</div>'
          : vagas.map(renderVagaRow).join("");
      })
      .catch(() => {
        document.getElementById("minhas-list").innerHTML = '<div class="empty-state">Não foi possível carregar os seus procedimentos.</div>';
      });
  }
</script>
</body>
</html>
